version: 2

seeds:
  - name: environmental_score_rules
    description: >
      Versioned configuration for calculating greenhouse
      environmental suitability scores.

      Generated from config/environmental_score.v1.json.
      Do not edit this CSV directly; regenerate it using
      scripts/generate_score_seed.py.

    columns:
      - name: score_version
        data_tests:
          - not_null

      - name: measurement_type
        data_tests:
          - not_null

      - name: unit
        data_tests:
          - not_null

      - name: weight
        data_tests:
          - not_null

      - name: tolerance_below
        data_tests:
          - not_null

      - name: tolerance_above
        data_tests:
          - not_null