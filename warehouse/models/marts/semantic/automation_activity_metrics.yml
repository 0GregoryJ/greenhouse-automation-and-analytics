version: 2

# Automation activity: how often and how long the fan and pump ran.
#
# Source: fct_actuator_cycles (one row per COMPLETED ON->OFF cycle).
#
# Which cycles count
#   * Fan: every cycle (all are paired 'sequential_state': each observed ON is
#     paired with the next observed OFF for that actuator, so the pairing is
#     inferred from adjacency).
#   * Pump: only pairing_method = 'cycle_id' cycles, i.e. an ON and an OFF that
#     share the controller's irrigation cycle_id. Pump ON/OFF pairs without a
#     cycle_id (for example a manual or unexpected activation) are paired
#     sequentially and are NOT controller-verified irrigation cycles, so the
#     pump_* metrics exclude them. No metric exposes them (none exist today);
#     the pairing_method dimension is available if one is ever needed.
#   * Cycles still ON (no OFF yet) are not in the model and are never counted.
#
# Time attribution: every metric is attributed to the cycle START
# (started_at_utc). A cycle that spans midnight belongs entirely to the day it
# started, including all of its runtime. Runtime is therefore "runtime of
# cycles started in the period", not "seconds the actuator was ON during the
# period", and no duty-cycle percentage is provided.
#
# Zero-filling: count and runtime metrics are joined to the daily/hourly time
# spine and filled with 0, so a day with no cycles returns 0 rather than no
# row. Averages and maxima stay NULL for such days.
# Durations are whole seconds (DATEDIFF('second')) between the observed ON and
# OFF state changes, so they carry up to about one second of rounding error.

semantic_models:
  - name: actuator_cycles
    description: >
      Completed actuator ON->OFF cycles. Grain: one row per completed cycle
      (cycle_id is unique per actuator). Incomplete cycles are absent.
      Timestamps are UTC. Duration is the observed ON-to-OFF interval in
      seconds. Pump cycles paired by cycle_id are controller-verified; fan
      cycles are inferred from consecutive state changes.
    model: ref('fct_actuator_cycles')
    defaults:
      agg_time_dimension: started_at_utc

    entities:
      - name: actuator_cycle
        type: primary
        expr: actuator || ':' || cycle_id

    dimensions:
      - name: started_at_utc
        type: time
        type_params:
          time_granularity: hour
        description: >
          UTC timestamp when the actuator was observed turning ON. All
          activity metrics are attributed to this time.
      - name: ended_at_utc
        type: time
        type_params:
          time_granularity: hour
        description: >
          UTC timestamp when the actuator was observed turning OFF. Not the
          default time axis; use only for questions about when cycles ended.
      - name: actuator
        type: categorical
        description: Actuator that ran, 'fan' or 'pump'.
      - name: pairing_method
        type: categorical
        description: >
          How ON and OFF were matched: 'cycle_id' (shared controller
          cycle id, verified) or 'sequential_state' (next OFF after an ON,
          inferred).
      - name: on_reason
        type: categorical
        description: >
          Controller reason on the ON state_changed event (for example
          shelly_status). Often NULL; do not rely on it to tell why a cycle
          started. Use automation_commands.reason for the commanded reason.
      - name: off_reason
        type: categorical
        description: Controller reason on the OFF event.
      - name: start_hour_of_day_utc
        type: categorical
        expr: HOUR(started_at_utc)
        description: >
          UTC hour of day (0-23) when the cycle started. Use to ask whether
          irrigation or cooling usually happens at the same time of day.

    measures:
      - name: cycles
        description: Completed cycles (distinct cycle per actuator).
        agg: count_distinct
        expr: actuator || ':' || cycle_id
      - name: runtime_seconds
        description: Sum of cycle durations in seconds.
        agg: sum
        expr: duration_seconds
      - name: cycle_duration_avg_seconds
        description: Average cycle duration in seconds.
        agg: average
        expr: duration_seconds
      - name: cycle_duration_max_seconds
        description: Longest cycle duration in seconds.
        agg: max
        expr: duration_seconds

metrics:
  # ---- Fan
  - name: fan_cycle_count
    label: Fan cycles (count)
    description: >
      Number of completed fan ON->OFF cycles that STARTED in the period (not
      when they ended). Zero for periods with no cycles. Fan cycles are
      inferred by pairing each observed ON with the next observed OFF, and a
      cycle still running is not counted. Group by metric_time__day for fan
      activity per day.
    type: simple
    type_params:
      measure:
        name: cycles
        fill_nulls_with: 0
        join_to_timespine: true
    filter: "{{ Dimension('actuator_cycle__actuator') }} = 'fan'"

  - name: total_fan_runtime_seconds
    label: Fan runtime (seconds)
    description: >
      Total measured runtime, in seconds, of completed fan cycles that STARTED
      in the period. Cycles are attributed entirely to their start time, so a
      cycle crossing midnight counts wholly toward the day it began. Zero when
      no cycles. Excludes any cycle still running. This is not a duty-cycle
      percentage.
    type: simple
    type_params:
      measure:
        name: runtime_seconds
        fill_nulls_with: 0
        join_to_timespine: true
    filter: "{{ Dimension('actuator_cycle__actuator') }} = 'fan'"

  - name: total_fan_runtime_hours
    label: Fan runtime (hours)
    description: >
      total_fan_runtime_seconds expressed in hours. Same attribution and
      limitations: completed cycles only, assigned to the day each started.
    type: derived
    type_params:
      expr: runtime_seconds / 3600.0
      metrics:
        - name: total_fan_runtime_seconds
          alias: runtime_seconds

  - name: avg_fan_cycle_duration_seconds
    label: Average fan cycle duration (seconds)
    description: >
      Mean duration, in seconds, of completed fan cycles started in the
      period. NULL when there were no cycles. Use to see whether fan cycles
      are getting longer; pair with avg_temperature_c by day to compare with
      how hot the day was. Whole-second resolution.
    type: simple
    type_params:
      measure: cycle_duration_avg_seconds
    filter: "{{ Dimension('actuator_cycle__actuator') }} = 'fan'"

  - name: max_fan_cycle_duration_seconds
    label: Longest fan cycle (seconds)
    description: >
      Duration in seconds of the longest completed fan cycle started in the
      period. NULL when there were no cycles.
    type: simple
    type_params:
      measure: cycle_duration_max_seconds
    filter: "{{ Dimension('actuator_cycle__actuator') }} = 'fan'"

  # ---- Pump (controller-verified cycle_id pairs only)
  - name: pump_cycle_count
    label: Pump irrigation cycles (count)
    description: >
      Number of completed, controller-verified irrigation cycles that STARTED
      in the period. Counts only cycles whose ON and OFF share a cycle_id;
      pump activations without a cycle_id (not initiated as a controller
      irrigation cycle) and cycles still running are excluded. Zero when none.
      A cycle is one pump run, so this is "how many times the pump ran".
    type: simple
    type_params:
      measure:
        name: cycles
        fill_nulls_with: 0
        join_to_timespine: true
    filter: |
      {{ Dimension('actuator_cycle__actuator') }} = 'pump'
      AND {{ Dimension('actuator_cycle__pairing_method') }} = 'cycle_id'

  - name: total_pump_runtime_seconds
    label: Pump runtime (seconds)
    description: >
      Total measured runtime, in seconds, of completed verified pump cycles
      that STARTED in the period (cycle_id pairs only). Whole-second
      resolution, so short runs carry large relative error. Zero when none.
    type: simple
    type_params:
      measure:
        name: runtime_seconds
        fill_nulls_with: 0
        join_to_timespine: true
    filter: |
      {{ Dimension('actuator_cycle__actuator') }} = 'pump'
      AND {{ Dimension('actuator_cycle__pairing_method') }} = 'cycle_id'

  - name: avg_pump_cycle_duration_seconds
    label: Average pump cycle duration (seconds)
    description: >
      Mean duration, in seconds, of completed verified pump cycles started in
      the period (cycle_id pairs only). NULL when there were no cycles.
    type: simple
    type_params:
      measure: cycle_duration_avg_seconds
    filter: |
      {{ Dimension('actuator_cycle__actuator') }} = 'pump'
      AND {{ Dimension('actuator_cycle__pairing_method') }} = 'cycle_id'

  - name: max_pump_cycle_duration_seconds
    label: Longest pump cycle (seconds)
    description: >
      Duration in seconds of the longest completed verified pump cycle
      started in the period (cycle_id pairs only). NULL when none.
    type: simple
    type_params:
      measure: cycle_duration_max_seconds
    filter: |
      {{ Dimension('actuator_cycle__actuator') }} = 'pump'
      AND {{ Dimension('actuator_cycle__pairing_method') }} = 'cycle_id'
