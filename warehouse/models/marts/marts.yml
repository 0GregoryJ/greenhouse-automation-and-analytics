
version: 2

models:
  - name: fct_sensor_hourly
    description: >
      Hourly environmental statistics grouped by UTC hour,
      gateway, sensor, measurement type, and unit.
      Calculated from valid deduplicated sensor readings.

    columns:
      - name: measurement_hour_utc
        data_tests:
          - not_null

      - name: gateway_id
        data_tests:
          - not_null

      - name: sensor_id
        data_tests:
          - not_null

      - name: measurement_type
        data_tests:
          - not_null

      - name: unit
        data_tests:
          - not_null

      - name: reading_count
        data_tests:
          - not_null

      - name: avg_value
        data_tests:
          - not_null

      - name: min_value
        data_tests:
          - not_null

      - name: max_value
        data_tests:
          - not_null

  - name: fct_sensor_daily
    description: >
      Daily environmental statistics grouped by UTC date,
      gateway, sensor, measurement type, and unit.
      Aggregated directly from individual valid readings.

    columns:
      - name: measurement_date_utc
        data_tests:
          - not_null

      - name: gateway_id
        data_tests:
          - not_null

      - name: sensor_id
        data_tests:
          - not_null

      - name: measurement_type
        data_tests:
          - not_null

      - name: unit
        data_tests:
          - not_null

      - name: reading_count
        data_tests:
          - not_null

      - name: avg_value
        data_tests:
          - not_null

      - name: min_value
        data_tests:
          - not_null

      - name: max_value
        data_tests:
          - not_null

  - name: fct_sensor_quality_daily
    description: >
      Daily monitoring metrics for raw sensor records,
      including duplicates, analytical validation failures,
      and the maximum observed interval between measurements.
      Invalid timestamps use Snowflake load date as a fallback.

    columns:
      - name: measurement_date_utc
        data_tests:
          - not_null

      - name: raw_record_count
        data_tests:
          - not_null

      - name: duplicate_record_count
        data_tests:
          - not_null

      - name: invalid_record_count
        data_tests:
          - not_null

      - name: valid_unique_reading_count
        data_tests:
          - not_null

      - name: max_reading_gap_seconds
        description: >
          Longest observed interval between valid consecutive
          readings, in seconds. May be null for a group with
          no comparable valid readings.

  - name: fct_environmental_score_hourly
    description: >
      Hourly environmental suitability scores by gateway.
      Combines air temperature (40%), relative humidity (25%),
      and soil moisture (35%) using conditions-v1 scoring rules.
      Values range from 0 to 100; higher values indicate closer
      alignment with the configured target ranges.

      Computed from hourly average sensor measurements.
      A null overall score means one or more required
      components were missing or invalid.

      Soil thresholds are provisional and expressed in raw
      sensor units. This score does not establish actual
      plant health.

    columns:
      - name: measurement_hour_utc
        description: UTC hour containing the aggregated measurements.
        data_tests:
          - not_null

      - name: gateway_id
        description: Gateway identifying the monitored greenhouse.
        data_tests:
          - not_null

      - name: score_version
        description: Version of the environmental scoring rules.
        data_tests:
          - not_null

      - name: environmental_score
        description: >
          Weighted composite environmental suitability score
          from 0 to 100. Null for incomplete intervals.

      - name: temperature_score
        description: Temperature suitability score from 0 to 100.

      - name: humidity_score
        description: Relative humidity suitability score from 0 to 100.

      - name: soil_score
        description: >
          Provisional raw soil moisture suitability score
          from 0 to 100.

      - name: metric_count
        description: Number of distinct matched measurement types.

      - name: valid_component_count
        description: Number of components with valid scores.

      - name: status
        description: Whether all three scoring components were available.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['complete', 'incomplete']

  - name: fct_environmental_score_daily
    description: >
      Daily aggregation of the hourly environmental suitability
      scores by gateway and scoring version.
      Reports the average, minimum, and maximum of valid
      hourly scores and the number of scored hours.

      Daily averages weight valid hourly buckets equally.
      They are not direct measurements of plant health.

    columns:
      - name: measurement_date_utc
        description: UTC date for the daily aggregation.
        data_tests:
          - not_null

      - name: gateway_id
        description: Gateway identifying the monitored greenhouse.
        data_tests:
          - not_null

      - name: score_version
        description: Scoring specification version.
        data_tests:
          - not_null

      - name: avg_environmental_score
        description: Average of valid hourly environmental scores.

      - name: min_environmental_score
        description: Minimum valid hourly environmental score.

      - name: max_environmental_score
        description: Maximum valid hourly environmental score.

      - name: scored_hours
        description: Number of hours with a non-null environmental score.
        data_tests:
          - not_null

      - name: hours_with_data
        description: Number of hourly rows considered.
        data_tests:
          - not_null

  - name: fct_automation_events
    description: >
      One row per deduplicated automation event from the gateway
      controller (fan and pump). Typed from stg_automation_events
      with UTC timestamps for analytics joins.

    columns:
      - name: event_id
        description: Unique automation event identifier.
        data_tests:
          - unique
          - not_null

      - name: actuator
        description: Actuator name (`fan` or `pump`).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['fan', 'pump']

      - name: event_type
        description: Automation lifecycle event type.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - command_issued
                  - command_acknowledged
                  - command_failed
                  - state_changed

      - name: measured_at_utc
        description: Event timestamp normalized to UTC.
        data_tests:
          - not_null

      - name: measurement_hour_utc
        description: UTC hour bucket containing the event.
        data_tests:
          - not_null

      - name: measurement_date_utc
        description: UTC date containing the event.
        data_tests:
          - not_null

      - name: cycle_id
        description: Optional pump cycle identifier linking related events.

      - name: command_id
        description: Optional Shelly RPC command identifier.

      - name: desired_state
        description: Commanded on/off state when applicable.

      - name: observed_state
        description: Confirmed relay state for state_changed events.

      - name: reason
        description: Controller reason code for the event.

      - name: temperature_c
        description: Air temperature snapshot when present.

      - name: soil_moisture_pct
        description: Calibrated soil moisture percent when present.

  - name: fct_actuator_cycles
    description: >
      One row per completed actuator ON→OFF cycle.
      Pump cycles with a shared cycle_id are paired on that id.
      Other transitions (for example fan) are paired sequentially
      from state_changed observations. Incomplete cycles that are
      still ON are excluded.

    columns:
      - name: cycle_id
        description: >
          Controller cycle_id when available; otherwise the ON
          event_id used as a surrogate key.
        data_tests:
          - not_null

      - name: actuator
        description: Actuator that completed an ON/OFF cycle.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['fan', 'pump']

      - name: on_event_id
        description: state_changed event that observed the actuator turning on.
        data_tests:
          - not_null

      - name: off_event_id
        description: state_changed event that observed the actuator turning off.
        data_tests:
          - not_null

      - name: started_at_utc
        description: UTC timestamp when the actuator turned on.
        data_tests:
          - not_null

      - name: ended_at_utc
        description: UTC timestamp when the actuator turned off.
        data_tests:
          - not_null

      - name: duration_seconds
        description: Elapsed seconds between ON and OFF observations.
        data_tests:
          - not_null

      - name: pairing_method
        description: >
          How the ON/OFF pair was formed (`cycle_id` or
          `sequential_state`).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['cycle_id', 'sequential_state']

      - name: on_reason
        description: Reason on the ON state_changed event.

      - name: off_reason
        description: Reason on the OFF state_changed event.

      - name: on_temperature_c
        description: Temperature snapshot from the ON event when present.

      - name: on_soil_moisture_pct
        description: Soil moisture snapshot from the ON event when present.
